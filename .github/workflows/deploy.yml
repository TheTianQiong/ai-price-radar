# AI 价格雷达：CI 验证 + 自动部署到 Cloudflare Workers
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、TRIGGER_SECRET、ADMIN_PASSWORD
# （详见 README「通过 GitHub Actions 部署」一节）

name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: 验证（解析器 + 冒烟 + 配置）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm ci
      - name: 验证各厂商解析器（真实抓官方页）
        run: npm run check:scrapers
      - name: 端到端冒烟测试（node:sqlite 模拟 D1）
        run: npm run smoke
      - name: wrangler 配置校验
        run: npx wrangler deploy --dry-run

  deploy:
    name: 部署到 Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm ci

      - name: 检查 D1 database_id 已配置
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" wrangler.jsonc; then
            echo "::error::wrangler.jsonc 的 database_id 还是占位符。请先在本地执行："
            echo "  npx wrangler login"
            echo "  npx wrangler d1 create ai-price-radar-db"
            echo "并把返回的 database_id 填入 wrangler.jsonc 后提交。"
            exit 1
          fi

      - name: 部署 D1 迁移（生产库建表）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ai-price-radar-db --remote

      - name: 部署 Worker（含 cron 与静态资源）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 敏感变量用 Worker Secrets 注入（不写入仓库），未配置则跳过
      - name: 注入 TRIGGER_SECRET / ADMIN_PASSWORD 为 Worker Secrets
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRIGGER_SECRET: ${{ secrets.TRIGGER_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -n "$TRIGGER_SECRET" ]; then echo "$TRIGGER_SECRET" | npx wrangler secret put TRIGGER_SECRET; fi
          if [ -n "$ADMIN_PASSWORD" ]; then echo "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi

      - name: 部署完成提示
        run: |
          echo "✅ 部署完成。"
          echo "请访问 https://<你的worker>.workers.dev/api/meta 确认各厂商状态，"
          echo "并到 https://<你的worker>.workers.dev/admin 用 ADMIN_PASSWORD 登录管理后台。"
